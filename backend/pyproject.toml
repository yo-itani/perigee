[project]
name = "perigee-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.135",
    "uvicorn~=0.41",
    "sqlalchemy~=2.0",
    "asyncmy~=0.2",
    "alembic~=1.18",
    "pydantic-settings~=2.13",
    "apscheduler~=3.11",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "httpx~=0.28",
    "pytest-asyncio~=0.25",
    "ruff~=0.11",
    "pyright~=1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: API layer tests requiring test database",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["foundation"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
