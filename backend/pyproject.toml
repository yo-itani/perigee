[project]
name = "perigee-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
markers = [
    "integration: API layer tests requiring test database",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
